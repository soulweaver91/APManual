name: Create Release - Unstable

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Changelog'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  create-release:
    name: Create unstable apworld
    runs-on: ubuntu-latest

    steps:
      - name: Set current version and date to env
        run: |
          echo "CURRENT_WORLD_VERSION=$(jq -r '.world_version' src/archipelago.json)" >> "$GITHUB_ENV"
          echo "CURRENT_DATE=$(date +'%Y%m%d')" >> "$GITHUB_ENV"
      - name: Set expected file basename to env
        run: echo "BASENAME=manual_jazzjackrabbit2_soulweaver" >> "$GITHUB_ENV"
      - name: Format changelog input as multiline string and put into env
        run: |
          echo 'CHANGELOG<<EOF' >> "$GITHUB_ENV"
          echo "_This is an unstable release. While it may contain new features, you should be prepared to encounter issues more often than usual if used in a multiworld._ \n\n" >> "$GITHUB_ENV"
          echo "${{ github.event.inputs.changelog }}" >> "$GITHUB_ENV"
          echo 'EOF' >> "$GITHUB_ENV"
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Create apworld file
        # rename src folder, zip it, change extension
        run: |
          mv src ${{ env.BASENAME }}
          zip -r ${{ env.BASENAME }}.zip ${{ env.BASENAME }}/*
          mv ${{ env.BASENAME }}.zip ${{ env.BASENAME }}.apworld
      - name: Upload apworld as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASENAME }}.apworld
          path: ${{ env.BASENAME }}.apworld
          if-no-files-found: error
      - name: Add Changelog text to a file for release body, to preserve newlines
        run: echo -en "${{ env.CHANGELOG }}" > bodyFile.md
      - name: Create an unstable release
        uses: ncipollo/release-action@v1
        with:
          name: "Jazz Jackrabbit 2 Manual Archipelago World v${{ env.CURRENT_WORLD_VERSION }}-{{ env.CURRENT_DATE }} (Unstable)"
          bodyFile: bodyFile.md
          tag: ${{ env.BASENAME }}
          commit: ${{ env.GITHUB_REF }}
          artifacts: "${{ env.BASENAME }}.apworld"
          prerelease: true
